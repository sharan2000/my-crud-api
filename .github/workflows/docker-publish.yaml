name: docker publish workflow

on:
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string

    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PAT:
        required: true

    outputs:
      image_name:
        description: image name with tag
        value: ${{ jobs.build-and-push.outputs.image_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_name: ${{ steps.image_name_output.outputs.image_name }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          # default picks up the docker file in the current directory. can pass other file name as well
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.repo_name }}:${{ github.sha }}
      
      - name: output image name
        id: image_name_output
        run: echo "image_name=${{ inputs.repo_name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"