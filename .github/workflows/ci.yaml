name: CI

on:
  push:
    branches:
      - master
  
  pull_request :
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ls -R
      - run: npm run lint
  
  test:
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test


  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: 
      - build

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build-output
      - run: ls

      