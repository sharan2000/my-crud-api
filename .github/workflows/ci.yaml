name: CI

on:
  push:
    branches:
      - master
  
  pull_request :
    branches:
      - master

env:
  ENV_START_MESSAGE: "Beep Boop!! Starting"
  ENV_SECRET_MESSAGE: ${{ secrets.SECRET_MESSAGE }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
  
  test:
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test


  build:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    outputs:
      build_version: ${{ steps.versioning.outputs.version }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: build-versioning
        id: versioning
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/

  deploy-staging:
    runs-on: ubuntu-latest
    needs: 
      - build

    environment: staging

    env: 
      DB_URL: ${{ secrets.DB_ADDRESS }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist/
      - run: echo "Deploying to Staging => build version => ${{needs.build.outputs.build_version}}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: 
    - build
    - deploy-staging

    environment: production

    env:
      DB_URL: ${{ secrets.DB_ADDRESS }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist/
      - run: echo "Deploying to Production => build version => ${{needs.build.outputs.build_version}}"

      