name: CI

on:
  push:
    branches:
      - master
  
  pull_request :
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build